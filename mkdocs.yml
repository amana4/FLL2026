site_name: FLL 2026–27 — BIOGLOW
site_description: Team workspace for our FIRST LEGO League Challenge season
site_url: https://amana4.github.io/FLL2026/
repo_url: https://github.com/amana4/FLL2026
repo_name: amana4/FLL2026
edit_uri: edit/main/

# Our markdown lives at the repo root, not in a docs/ subfolder. The same-dir
# plugin lets MkDocs publish it in place, so there's exactly one copy of every
# document and the site can never drift from the repo.
#
# site_dir sits inside docs_dir here, which MkDocs would normally reject — the
# same-dir plugin makes it work by excluding the output folder from the build.
docs_dir: .
site_dir: site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.action.edit      # "edit this page" button → straight to GitHub
    - content.code.copy
    - toc.follow
  palette:
    # Students practice in bright gyms and dark bedrooms. Offer both.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - same-dir
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true          # renders our ☐ checklists properly
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Files that shouldn't become web pages.
#
# ⚠️ team-roster.md is excluded ON PURPOSE. It holds students' names, grades,
# and contact details, and this site is PUBLIC. Do not add it to the site.
# It stays in the repo for the team; it must not be published. Apply the same
# care to anything else naming a minor — photos of students especially.
#
# The official-materials PDFs and .pptx decks are committed to git (so a clone
# gets everything) but excluded from the SITE build. docs_dir is the repo root,
# so without this MkDocs would copy ~121MB of binaries into the deploy
# artifact, making every build slow for no benefit — nothing links to them as
# pages. Team members read them from their local checkout.
exclude_docs: |
  .github/
  .venv/
  venv/
  site/
  docs/team-roster.md
  docs/official-materials/*.pdf
  docs/official-materials/*.pptx
  docs/official-materials/*.llsp3
  docs/official-materials/*.mp4

# Templates and folder placeholders are reachable from their section pages but
# deliberately kept out of the nav — they'd clutter it, and they aren't meant
# to be read top-to-bottom.
not_in_nav: |
  **/_TEMPLATE.md
  code/screenshots/README.md
  code/spike-projects/README.md

