site_name: FLL 2026–27 — BIOGLOW
site_description: Team workspace for our FIRST LEGO League Challenge season
site_url: https://amana4.github.io/FLL2026/
repo_url: https://github.com/amana4/FLL2026
repo_name: amana4/FLL2026
edit_uri: edit/main/

# Our markdown lives at the repo root, not in a docs/ subfolder. The same-dir
# plugin lets MkDocs publish it in place, so there's exactly one copy of every
# document and the site can never drift from the repo.
#
# site_dir sits inside docs_dir here, which MkDocs would normally reject — the
# same-dir plugin makes it work by excluding the output folder from the build.
docs_dir: .
site_dir: site

# Reproduce CI locally: `mkdocs serve` now fails the same way the build does.
strict: true

# --strict alone does not check in-page anchors, which is how a dead
# #heading-that-moved link survived for a day. This closes that gap.
validation:
  omitted_files: warn
  absolute_links: info
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  # Nunito is rounded and friendly without being childish, and it stays legible
  # at small sizes on a phone — which matters more than personality when the
  # audience is nine.
  font:
    text: Nunito
    code: JetBrains Mono
  features:
    - navigation.sections      # vertical sidebar with groups as headings
    - navigation.prune         # only expand the branch you are in, not all 55 pages
    - navigation.indexes       # a section's README becomes the section landing page
    - navigation.footer        # automatic prev/next at the bottom of every page
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.action.edit      # "edit this page" button → straight to GitHub
    - content.code.copy
    - content.tooltips         # glossary terms get hover/tap definitions
    - toc.follow
  palette:
    # Students practice in bright gyms and dark bedrooms. Offer both.
    #
    # green/lime here is the fallback: tools/theme.css refines these into the
    # exact BIOGLOW rainforest hues, but if that file ever fails to load the site
    # is still green and still readable rather than snapping back to indigo.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - same-dir
  - search

extra_css:
  # theme.css first so print.css can still override it.
  - tools/theme.css
  - tools/print.css

extra_javascript:
  - tools/checkbox-state.js

copyright: >
  Team materials are ours. FIRST&reg;, LEGO&reg;, FIRST&reg; LEGO&reg; League and
  BIOGLOW&trade; and all official challenge materials are the property of FIRST
  and the LEGO Group.

markdown_extensions:
  - abbr                             # powers glossary tooltips
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde                   # ~~strikethrough~~, used on done items
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true              # a missing include fails the build
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true       # tappable; tools/checkbox-state.js persists them
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Files that shouldn't become web pages.
#
# IMPORTANT: exclude_docs and not_in_nav do different jobs, and confusing them
# caused a real leak. `not_in_nav` ONLY silences the "this file isn't in the nav"
# warning — the file is still built, published and search-indexed. Only
# `exclude_docs` actually keeps a file off the site. CLAUDE.md sat in not_in_nav
# for a day and was live at /CLAUDE/ as a result.
#
# team-roster.md is excluded ON PURPOSE. It holds students' names, grades,
# and contact details, and this site is PUBLIC. Apply the same care to anything
# else naming a minor — photos of students especially.
#
# team-fund.md and team-fund.csv are excluded for the same reason: they track
# what each family has contributed. That belongs between the coach and the
# parents, not on a public page. team-links.md is excluded because it holds the
# Google Drive folder link, which should not be on a search-indexed page.
#
# Note that excluding a file from the SITE does not hide it from the public
# repo. Anything that must stay private has to be gitignored, not just listed
# here.
#
# The official-materials PDFs and .pptx decks are committed to git (so a clone
# gets everything) but excluded from the SITE build. docs_dir is the repo root,
# so without this MkDocs would copy ~121MB of binaries into the deploy
# artifact, making every build slow for no benefit — nothing links to them as
# pages. Team members read them from their local checkout.
#
# code/2025-reference/ is last season's code, carried over for reuse. It is
# not documentation, so it is kept off the site rather than published as pages.
exclude_docs: |
  .github/
  includes/
  .venv/
  venv/
  site/
  CLAUDE.md
  requirements.txt
  mkdocs.yml
  .DS_Store
  docs/team-roster.md
  docs/team-fund.md
  docs/team-fund.csv
  docs/team-links.md
  docs/official-materials/*.pdf
  docs/official-materials/*.pptx
  docs/official-materials/*.llsp3
  docs/official-materials/*.mp4
  code/spike-projects/*.llsp3
  code/2025-reference/

# not_in_nav ONLY silences the "not in nav" warning. These files ARE published;
# they are simply kept out of the menu because they are templates or folder
# placeholders rather than pages to read top-to-bottom. Anything that must not
# be published belongs in exclude_docs above.
not_in_nav: |
  **/_TEMPLATE.md
  code/screenshots/README.md
  code/spike-projects/README.md
  meetings/plan/README.md
  meetings/20*.md
  meetings/plan/m*.md

nav:
  - Home: README.md

  # Top of the menu is what gets opened every week: write a note after a
  # session, or look something up in FIRST's own materials. Everything a person
  # reads once has been pushed to the bottom, not deleted — removing a page from
  # the nav does not unpublish it, it just makes it unreachable except by search.
  #
  # Labels are written for a 9-year-old, EXCEPT the official FIRST terms —
  # Innovation Project, Core Values, Robot Design, Engineering Notebook. Those
  # stay word-for-word, because the students need to recognise and say them in
  # the judging room. Making those friendlier would cost them marks.
  - Write today's notes: docs/after-class-notes.md
  - Rules and official PDFs: docs/official-materials/README.md

  - Our meetings:
      - All 26 meetings: docs/meeting-plan.md
      - What happened each time: meetings/README.md
      - Who did what: docs/who-did-what.md

  - Robot:
      - robot-game/README.md
      - Which missions we'll try: robot-game/strategy.md
      - Where things are on the mat: robot-game/field-map.md
      - Run plans: robot-game/runs/README.md
      - Scoresheet: robot-game/scoresheet.md
      - Points tracker: robot-game/scoring-tracker.md
      - The 15 missions:
          - robot-game/missions/README.md
          - M01 Drone Survey: robot-game/missions/M01-drone-survey.md
          - M02 Exploding Seeds: robot-game/missions/M02-exploding-seeds.md
          - M03 Flip the Rock: robot-game/missions/M03-flip-the-rock.md
          - M04 Lucky Leaves: robot-game/missions/M04-lucky-leaves.md
          - M05 Reaching Roots: robot-game/missions/M05-reaching-roots.md
          - M06 Leafcutter Frenzy: robot-game/missions/M06-leafcutter-frenzy.md
          - M07 Humongous Fungus: robot-game/missions/M07-humongous-fungus.md
          - M08 Tangled: robot-game/missions/M08-tangled.md
          - M09 Research Platform: robot-game/missions/M09-research-platform.md
          - M10 Fragile Microhabitats: robot-game/missions/M10-fragile-microhabitats.md
          - M11 Window to the Past: robot-game/missions/M11-window-to-the-past.md
          - M12 Forest Elder: robot-game/missions/M12-forest-elder.md
          - M13 Keystone Species: robot-game/missions/M13-keystone-species.md
          - M14 Seeds of Renewal: robot-game/missions/M14-seeds-of-renewal.md
          - M15 Biocentric Architecture: robot-game/missions/M15-biocentric-architecture.md
      - Robot Design:
          - robot-design/README.md
          - The driving base: robot-design/chassis.md
          - Attachments: robot-design/attachments/README.md
          - Design log — what we changed: robot-design/design-log.md
          - When something breaks: robot-design/troubleshooting.md
      - Code:
          - code/README.md
          - Shared code (the toolkit): code/library/README.md
          - Mission programs: code/missions/README.md
          - Word Blocks (what we used before): code/my-blocks.md
          - SPIKE lessons: code/spike-lessons.md

  - Innovation Project:
      - innovation-project/README.md
      - Ideas — brainstorm: innovation-project/brainstorm.md
      - The problem we picked: innovation-project/problem.md
      - Emailing experts: innovation-project/expert-outreach.md
      - What we found out: innovation-project/research.md
      - Our solution: innovation-project/solution.md
      - Showing it to people: innovation-project/sharing.md
      - The presentation: innovation-project/presentation/README.md

  - Core Values:
      - core-values/README.md
      - Our team agreement: core-values/team-agreement.md
      - Things we did well — evidence log: core-values/evidence-log.md

  - Judging day:
      - docs/judging/README.md
      - Innovation Project prep: docs/judging/innovation-project-prep.md
      - Robot Design prep: docs/judging/robot-design-prep.md
      - Core Values prep: docs/judging/core-values-prep.md

  - Competition day:
      - competition/README.md
      - Print this one page: competition/quick-reference.md
      - What happens on the day: competition/tournament-day.md
      - What to pack: competition/packing-list.md
      - The awards: competition/awards.md
      - Rules about who can compete: competition/eligibility.md
      - If we get through: competition/after-the-qualifier.md

  - Engineering Notebook: engineering-notebook/README.md

  # Read once, then rarely again. Kept in the menu so they stay findable, but out
  # of the way of the pages used weekly.
  - Start here:
      - What is BIOGLOW?: docs/what-is-bioglow.md
      - For parents: docs/for-parents.md
      - How much can a grown-up help?: docs/coaching.md
      - Our kit and equipment: docs/equipment.md
      - Staying safe: docs/safety.md

  - Useful extras:
      - Glossary — what the words mean: docs/glossary.md
      - Joining the team late: docs/new-member.md
      - Including everyone: docs/inclusion.md
      - FIRST's 12 official sessions: docs/official-sessions.md
      - How we save our work (git): CONTRIBUTING.md
      - How this website works: docs/website.md
      - End-of-season review: docs/retrospective.md
