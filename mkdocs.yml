      - Scoring tracker: robot-game/scoring-tracker.md
      - Missions:
          - robot-game/missions/README.md
          - M01 Drone Survey: robot-game/missions/M01-drone-survey.md
          - M02 Exploding Seeds: robot-game/missions/M02-exploding-seeds.md
          - M03 Flip the Rock: robot-game/missions/M03-flip-the-rock.md
          - M04 Lucky Leaves: robot-game/missions/M04-lucky-leaves.md
          - M05 Reaching Roots: robot-game/missions/M05-reaching-roots.md
          - M06 Leafcutter Frenzy: robot-game/missions/M06-leafcutter-frenzy.md
          - M07 Humongous Fungus: robot-game/missions/M07-humongous-fungus.md
          - M08 Tangled: robot-game/missions/M08-tangled.md
          - M09 Research Platform: robot-game/missions/M09-research-platform.md
          - M10 Fragile Microhabitats: robot-game/missions/M10-fragile-microhabitats.md
          - M11 Window to the Past: robot-game/missions/M11-window-to-the-past.md
          - M12 Forest Elder: robot-game/missions/M12-forest-elder.md
          - M13 Keystone Species: robot-game/missions/M13-keystone-species.md
          - M14 Seeds of Renewal: robot-game/missions/M14-seeds-of-renewal.md
          - M15 Biocentric Architecture: robot-game/missions/M15-biocentric-architecture.md
      - Design:
          - robot-design/README.md
          - Chassis: robot-design/chassis.md
