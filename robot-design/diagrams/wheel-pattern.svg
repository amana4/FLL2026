<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Six designs sorted by their wheels: three slip, three do not</title>
<desc id="d">Left group, blue SPIKE wheels: HummerOne Pro, Xbot and YellowBot v1, which all list wheel slipping. Right group, 62.4 mm LEGO wheels: YellowBot v2, Track-X and Boxor, which list no slipping. A coach who switched to 62.4 mm wheels says the robot stopped slipping on turns.</desc>
<rect width="900" height="470" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Six designs: three slip, three do not</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Sort them by their wheels, and the slipping stops exactly where the wheels change.</text><rect x="60" y="100" width="360" height="300" rx="16" fill="#fdecea" stroke="#c0392b" stroke-width="3"/><text x="240" y="135" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold">Blue SPIKE wheels</text><rect x="100" y="175" width="280" height="46" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><circle cx="132" cy="198" r="14" fill="#1f2933"/><circle cx="132" cy="198" r="6" fill="#c0392b"/><text x="260" y="204" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">HummerOne Pro</text><rect x="100" y="237" width="280" height="46" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><circle cx="132" cy="260" r="14" fill="#1f2933"/><circle cx="132" cy="260" r="6" fill="#c0392b"/><text x="260" y="266" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Xbot</text><rect x="100" y="299" width="280" height="46" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><circle cx="132" cy="322" r="14" fill="#1f2933"/><circle cx="132" cy="322" r="6" fill="#c0392b"/><text x="260" y="328" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">YellowBot v1</text><text x="240" y="380" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold">wheels slip</text><rect x="480" y="100" width="360" height="300" rx="16" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="660" y="135" font-size="18" fill="#1b6b47" text-anchor="middle" font-weight="bold">62.4 mm LEGO wheels</text><rect x="520" y="175" width="280" height="46" rx="10" fill="#ffffff" stroke="#1b6b47" stroke-width="2"/><circle cx="552" cy="198" r="14" fill="#1f2933"/><circle cx="552" cy="198" r="6" fill="#1b6b47"/><text x="680" y="204" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">YellowBot v2</text><rect x="520" y="237" width="280" height="46" rx="10" fill="#ffffff" stroke="#1b6b47" stroke-width="2"/><circle cx="552" cy="260" r="14" fill="#1f2933"/><circle cx="552" cy="260" r="6" fill="#1b6b47"/><text x="680" y="266" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Track-X</text><rect x="520" y="299" width="280" height="46" rx="10" fill="#ffffff" stroke="#1b6b47" stroke-width="2"/><circle cx="552" cy="322" r="14" fill="#1f2933"/><circle cx="552" cy="322" r="6" fill="#1b6b47"/><text x="680" y="328" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Boxor</text><text x="660" y="380" font-size="18" fill="#1b6b47" text-anchor="middle" font-weight="bold">no slipping listed</text><text x="450" y="440" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">A coach who switched to 62.4 mm wheels says the robot stopped slipping on turns.</text>
</svg>
