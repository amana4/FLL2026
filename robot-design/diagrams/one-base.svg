<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">One base, many attachments</title>
<desc id="d">Four attachments, a push arm with no motor, the BOXOR frame with arms we swap, the keystone holder that rides the robo taxi, and a next idea using the same pegs, all fit one driving base that never changes. Every change to the base breaks the attachments built for it, so freeze the base, then build attachments.</desc>
<rect width="1000" height="500" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="500" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">One base, many attachments</text><text x="500" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Get the base right once. After that, only the attachments change.</text><rect x="380" y="330" width="240" height="90" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="5"/><text x="500" y="370" font-size="18" fill="#1b6b47" text-anchor="middle" font-weight="bold">one driving base</text><text x="500" y="396" font-size="14" fill="#1b6b47" text-anchor="middle" font-weight="normal">never changes</text><rect x="55" y="110" width="190" height="80" rx="10" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="150" y="146" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">push arm</text><text x="150" y="170" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">no motor needed</text><polyline points="150,192 377.5,326" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><rect x="285" y="110" width="190" height="80" rx="10" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="380" y="146" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">BOXOR frame</text><text x="380" y="170" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">arms we swap</text><polyline points="380,192 458.0,326" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><rect x="525" y="110" width="190" height="80" rx="10" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="620" y="146" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">keystone holder</text><text x="620" y="170" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">rides the robo taxi</text><polyline points="620,192 542.0,326" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><rect x="755" y="110" width="190" height="80" rx="10" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="850" y="146" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">next idea</text><text x="850" y="170" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">same pegs</text><polyline points="850,192 622.5,326" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="500" y="470" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">Every change to the base breaks the attachments built for it. So freeze the base, then build attachments.</text>
</svg>
