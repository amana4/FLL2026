<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 570" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">How the gyro keeps us straight: the correction loop</title>
<desc id="d">A simple loop. drive_cm(30) starts. 1: read the gyro to see how far off straight we are. 2: steer back, harder the further off we are. Then ask: gone far enough? If yes, brake and stop. If no, 3: wait 15 milliseconds and repeat from step 1. The loop runs about 66 times every second.</desc>
<rect width="750" height="570" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="350" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">How the gyro keeps us straight</text><text x="350" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">This loop runs about 66 times every second.</text><rect x="220.0" y="87.0" width="260" height="46" rx="23.0" fill="#1b6b47"/><text x="350" y="116.3" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">drive_cm(30)</text><polyline points="350,133 350,163" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="140.0" y="165.0" width="420" height="60" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="350" y="189.95" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">1. Read the gyro</text><text x="350" y="211.95" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="normal">How far off straight are we?</text><polyline points="350,225 350,255" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="140.0" y="257.0" width="420" height="60" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="350" y="281.95" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">2. Steer back</text><text x="350" y="303.95" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="normal">The further off, the harder it steers</text><polyline points="350,317 350,347" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polygon points="350,350.0 500.0,400 350,450.0 200.0,400" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="350" y="394.95" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Gone</text><text x="350" y="416.95" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="normal">far enough?</text><polyline points="500,400 548,400" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><text x="524" y="388" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="bold">yes</text><rect x="550.0" y="375.0" width="180" height="50" rx="25.0" fill="#1f2933"/><text x="640" y="405.95" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">Brake. Done.</text><polyline points="350,450 350,485" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><text x="372" y="472" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="bold">no</text><rect x="220.0" y="490.0" width="260" height="50" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="350" y="520.95" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">3. Wait 15 ms</text><polyline points="220,515 90,515 90,195 140,195" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><text x="60" y="360" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="bold">repeat</text>
</svg>
