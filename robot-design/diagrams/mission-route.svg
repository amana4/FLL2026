<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Our missions and our route across the mat</title>
<desc id="d">A map of the mat from above. The left home is bottom left and the right home is bottom right. From the left home, phase0-alt does M03 Flip the Rock and M02 Exploding Seeds. phase2 does M01 Drone Survey and M15 Biocentric Architecture on the City dock with one straight push, and comes straight back. phase3 does M05 Reaching Roots, then drives to the right side as a robo taxi, carrying one attachment and the keystone species. From the right, Phase 5 does M11, M06, M07 and part of M12, and Phase 6 takes the keystone species to the Mine dock for M13. M04 Lucky Leaves is skipped on purpose. M08, M09, M10 and M14 are not in our runs. Routes are a sketch, not measured paths.</desc>
<rect width="1000" height="760" rx="16" fill="#ffffff"/>
