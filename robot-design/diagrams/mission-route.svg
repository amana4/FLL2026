<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 775" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Our missions and our route across the mat</title>
<desc id="d">A map of the mat from above. The left home is bottom left and the right home is bottom right. There are seven runs, Phase 0 to Phase 7, and no Phase 4. From the left home, Phase 0 does M03 Flip the Rock and M02 Exploding Seeds. Phase 1 does M05 Reaching Roots. Phase 2 does M01 Drone Survey and the garden skylight of M15 Biocentric Architecture on the City dock with one straight push, and comes straight back. Phase 3 is the robo taxi: it drives to the right side carrying one attachment and the keystone species. From the right, Phase 5 does M11, M06, M07 and part of M12, Phase 6 takes the keystone species to the Mine dock for M13, and Phase 7 does the nesting canopy and the compost hatch of M15. M04 Lucky Leaves is skipped on purpose. M08, M09, M10 and M14 are not in our runs. Routes are a sketch, not measured paths.</desc>
<rect width="1000" height="775" rx="16" fill="#ffffff"/>
