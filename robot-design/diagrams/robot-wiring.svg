<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 610" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Our robot from above: what is plugged in where</title>
<desc id="d">Schematic top view. The left wheel motor is on socket F and the right wheel motor on socket A. The hub sits in the middle, face up. The attachment is on the back, with motors on sockets C and E. The robot drives backwards into the models.</desc>
<rect width="800" height="610" rx="16" fill="#ffffff"/>
<text x="400" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Our robot from above</text><text x="400" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">A map of what is plugged in where. Not to scale.</text><text x="400" y="96" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="bold">FRONT</text><rect x="250" y="110" width="300" height="300" rx="18" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><rect x="320" y="170" width="160" height="150" rx="14" fill="#ffffff" stroke="#1f2933" stroke-width="3"/><text x="400" y="235" font-size="22" fill="#1f2933" text-anchor="middle" font-weight="bold">Hub</text><text x="400" y="260" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">gyro inside</text><text x="400" y="282" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">face up, button on top</text><rect x="190" y="200" width="50" height="110" rx="12" fill="#1f2933"/><circle cx="215" cy="255" r="20" fill="#1b6b47" stroke="#ffffff" stroke-width="3"/><text x="215" y="262" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">F</text><text x="110" y="248" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Left wheel</text><text x="110" y="270" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">motor on F</text><rect x="560" y="200" width="50" height="110" rx="12" fill="#1f2933"/><circle cx="585" cy="255" r="20" fill="#1b6b47" stroke="#ffffff" stroke-width="3"/><text x="585" y="262" font-size="20" fill="#ffffff" text-anchor="middle" font-weight="bold">A</text><text x="690" y="248" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Right wheel</text><text x="690" y="270" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">motor on A</text><rect x="270" y="410" width="260" height="70" rx="12" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="400" y="440" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Attachment (BOXOR frame)</text><circle cx="335" cy="462" r="15" fill="#b7791f"/><text x="335" y="468" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">C</text><circle cx="465" cy="462" r="15" fill="#b7791f"/><text x="465" y="468" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="bold">E</text><text x="400" y="467" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">motors</text><text x="400" y="505" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="bold">BACK</text><line x1="680" y1="380" x2="680" y2="490" stroke="#1b6b47" stroke-width="6" stroke-linecap="round"/><polygon points="666,485 694,485 680,510" fill="#1b6b47"/><text x="690" y="540" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">drives backwards</text><text x="690" y="560" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">into the models</text><text x="400" y="585" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">Socket letters F, A, C and E come from our final code.</text>
</svg>
