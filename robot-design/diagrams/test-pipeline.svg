<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">How we test our code: pretend robot, automatic checks, real mat, save in git</title>
<desc id="d">Four steps from left to right. 1, pretend robot: run the code on a pretend mat in the browser. 2, automatic checks: check-library.py runs 34 checks on the pretend hub in seconds. 3, real mat: run it, measure it, change a number. 4, save in git with a note; 33 saves to our code so far. If a problem is found, go round again.</desc>
<rect width="900" height="450" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">How we test our code</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Cheap, fast tests first. The real mat last.</text><rect x="40" y="110" width="190" height="210" rx="14" fill="#e6f0fa" stroke="#2b6cb0" stroke-width="3"/><text x="135" y="145" font-size="17" fill="#2b6cb0" text-anchor="middle" font-weight="bold">1. Pretend robot</text><text x="135" y="190" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Run the code on a</text><text x="135" y="216" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">pretend mat in the</text><text x="135" y="242" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">browser. No robot</text><text x="135" y="268" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">needed.</text><polyline points="232,215 253,215" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="255" y="110" width="190" height="210" rx="14" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="350" y="145" font-size="17" fill="#1b6b47" text-anchor="middle" font-weight="bold">2. Automatic checks</text><text x="350" y="190" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">check-library.py</text><text x="350" y="216" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">runs 34 checks on</text><text x="350" y="242" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">the pretend hub in</text><text x="350" y="268" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">seconds.</text><polyline points="447,215 468,215" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="470" y="110" width="190" height="210" rx="14" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="565" y="145" font-size="17" fill="#b7791f" text-anchor="middle" font-weight="bold">3. Real mat</text><text x="565" y="190" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Run it, measure it,</text><text x="565" y="216" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">change a number.</text><text x="565" y="242" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">The #was notes</text><text x="565" y="268" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">show this.</text><polyline points="662,215 683,215" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="685" y="110" width="190" height="210" rx="14" fill="#f1f3f5" stroke="#1f2933" stroke-width="3"/><text x="780" y="145" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">4. Save in git</text><text x="780" y="190" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Every change is</text><text x="780" y="216" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">saved with a note.</text><text x="780" y="242" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">33 saves to our</text><text x="780" y="268" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">code so far.</text><path d="M800,330 Q800,390 450,390 Q100,390 100,334" fill="none" stroke="#2e8f61" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#ar)"/><text x="450" y="420" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">Found a problem? Go round again.</text>
</svg>
