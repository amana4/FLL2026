<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Our code is built in layers</title>
<desc id="d">Three layers. At the top, the run programs say what to do, such as back 44 cm then face 90. In the middle, our library advanced.py says how: drive_cm, face, turn_deg, arc_turn, attachments and safety stops. At the bottom, the SPIKE hub turns the motors and measures with the gyro and encoders.</desc>
<rect width="900" height="570" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Our code is built in layers</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Each layer only uses the layer under it.</text><rect x="90" y="100" width="720" height="110" rx="14" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="450" y="136" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="bold">Run programs</text><text x="450" y="163" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">phase0-alt.py, phase3.py, Phase 5.py, Phase 6.py</text><text x="450" y="189" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="bold">Says WHAT to do: "back 44 cm, then face 90"</text><polyline points="450,212 450,236" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="90" y="240" width="720" height="110" rx="14" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="450" y="276" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="bold">Our library: advanced.py</text><text x="450" y="303" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">drive_cm, face, turn_deg, arc_turn, attachments, safety stops</text><text x="450" y="329" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">Says HOW to do it: speed up, steer with the gyro, stop exactly</text><polyline points="450,352 450,376" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="90" y="380" width="720" height="110" rx="14" fill="#e6f0fa" stroke="#2b6cb0" stroke-width="3"/><text x="450" y="416" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="bold">The SPIKE hub</text><text x="450" y="443" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">motors on F, A, C, E, the gyro, the wheel encoders</text><text x="450" y="469" font-size="16" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Does it: turns the motors, measures the turn</text><text x="450" y="540" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Like My Blocks: we write drive_cm once, and every run uses it.</text>
</svg>
