<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 754" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Why we chose our robot: HummerOne Pro against our robot</title>
<desc id="d">Sketched side views of HummerOne Pro and our robot, not to scale, and four rows comparing them. Building it: HummerOne Pro is the easiest to build, from one kit plus the expansion set; ours is more work but fixes the problems below. Wheels: HummerOne Pro uses blue SPIKE wheels that slip once an attachment gets heavy; ours uses black grippy wheels held on both sides by the frame. Lining up: HummerOne Pro is not one of the box-frame designs; ours has flat walls that square up on the wall and on the lines on the mat. Changing attachments: HummerOne Pro uses simple clip-on attachments; ours drops them onto pegs in one move, because last season swaps were slow.</desc>
<rect width="1000" height="754" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="500" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Why we chose our robot</text><text x="500" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">HummerOne Pro was the easiest design we looked at. Here is what we did differently, and why.</text><text x="250" y="110" font-size="20" fill="#5f6b76" text-anchor="middle" font-weight="bold">HummerOne Pro</text><text x="250" y="132" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">one of the six designs we studied</text><rect x="130" y="150" width="220" height="110" rx="6" fill="#f2f2f2" stroke="#5f6b76" stroke-width="4"/><text x="240" y="208" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="bold">robot body</text><circle cx="170" cy="272" r="28" fill="#2b6cb0" stroke="#1f2933" stroke-width="3"/><circle cx="310" cy="272" r="28" fill="#2b6cb0" stroke="#1f2933" stroke-width="3"/><rect x="350" y="180" width="60" height="50" rx="5" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><circle cx="360" cy="192" r="5" fill="#c0392b"/><circle cx="360" cy="218" r="5" fill="#c0392b"/><text x="380" y="170" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="bold">clip-on</text><line x1="40" y1="300" x2="440" y2="300" stroke="#9aa5ad" stroke-width="3"/><text x="750" y="110" font-size="20" fill="#1b6b47" text-anchor="middle" font-weight="bold">Our robot</text><text x="750" y="132" font-size="14" fill="#1b6b47" text-anchor="middle" font-weight="normal">took the good ideas from all six designs</text><rect x="600" y="230" width="300" height="62" rx="6" fill="#e8f3ee" stroke="#1b6b47" stroke-width="5"/><text x="750" y="268" font-size="14" fill="#1b6b47" text-anchor="middle" font-weight="bold">flat box, wheels inside</text><circle cx="655" cy="288" r="12" fill="#1f2933"/><circle cx="845" cy="288" r="12" fill="#1f2933"/><rect x="630" y="192" width="240" height="38" rx="6" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="750" y="217" font-size="13" fill="#b7791f" text-anchor="middle" font-weight="bold">attachment sits on pegs</text><line x1="550" y1="300" x2="950" y2="300" stroke="#9aa5ad" stroke-width="3"/><text x="500" y="330" font-size="12" fill="#5f6b76" text-anchor="middle" font-weight="normal">sketches, not to scale</text><rect x="40" y="350" width="920" height="84" rx="10" fill="#ffffff" stroke="#e3e9e5" stroke-width="2"/><text x="60" y="380" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Building it</text><line x1="60" y1="396" x2="240" y2="396" stroke="#e3e9e5"/><circle cx="92" cy="414" r="12" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2"/><polyline points="86,414 91,419 99,409" fill="none" stroke="#1b6b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="112" y="419" font-size="14" fill="#5f6b76" text-anchor="start" font-weight="normal">Easiest to build: one kit plus the expansion set</text><circle cx="532" cy="414" r="12" fill="#ffffff" stroke="#9aa5ad" stroke-width="2"/><text x="552" y="419" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">More work to build, but it fixes the problems below</text><rect x="40" y="446" width="920" height="84" rx="10" fill="#ffffff" stroke="#e3e9e5" stroke-width="2"/><text x="60" y="476" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Wheels</text><line x1="60" y1="492" x2="240" y2="492" stroke="#e3e9e5"/><circle cx="92" cy="510" r="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><line x1="87" y1="505" x2="97" y2="515" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="97" y1="505" x2="87" y2="515" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><text x="112" y="515" font-size="14" fill="#5f6b76" text-anchor="start" font-weight="normal">Blue SPIKE wheels: they slip once an attachment gets heavy</text><circle cx="532" cy="510" r="12" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2"/><polyline points="526,510 531,515 539,505" fill="none" stroke="#1b6b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="552" y="515" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">Black grippy wheels, held on both sides by the frame</text><rect x="40" y="542" width="920" height="84" rx="10" fill="#ffffff" stroke="#e3e9e5" stroke-width="2"/><text x="60" y="572" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Lining up</text><line x1="60" y1="588" x2="240" y2="588" stroke="#e3e9e5"/><circle cx="92" cy="606" r="12" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><line x1="87" y1="601" x2="97" y2="611" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><line x1="97" y1="601" x2="87" y2="611" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/><text x="112" y="611" font-size="14" fill="#5f6b76" text-anchor="start" font-weight="normal">Not one of the box-frame designs</text><circle cx="532" cy="606" r="12" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2"/><polyline points="526,606 531,611 539,601" fill="none" stroke="#1b6b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="552" y="611" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">Flat walls: it squares up on the wall and on the lines on the mat</text><rect x="40" y="638" width="920" height="84" rx="10" fill="#ffffff" stroke="#e3e9e5" stroke-width="2"/><text x="60" y="668" font-size="16" fill="#1f2933" text-anchor="start" font-weight="bold">Changing attachments</text><line x1="60" y1="684" x2="240" y2="684" stroke="#e3e9e5"/><circle cx="92" cy="702" r="12" fill="#ffffff" stroke="#9aa5ad" stroke-width="2"/><text x="112" y="707" font-size="14" fill="#5f6b76" text-anchor="start" font-weight="normal">Simple clip-on attachments</text><circle cx="532" cy="702" r="12" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2"/><polyline points="526,702 531,707 539,697" fill="none" stroke="#1b6b47" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="552" y="707" font-size="14" fill="#1f2933" text-anchor="start" font-weight="normal">Gravity: drop it on the pegs, one move. Last season swaps were slow</text>
</svg>
