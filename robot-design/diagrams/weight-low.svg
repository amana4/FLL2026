<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Keep the weight low and in the middle</title>
<desc id="d">Two robots side by side. On the left, a tall robot with the heavy part up high rocks and tips when it stops. On the right, a flat robot with the heavy part low and in the middle stops flat. Our hub lies flat. Try it: stop hard from full speed and watch for a wobble.</desc>
<rect width="1000" height="550" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="500" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Keep the weight low and in the middle</text><text x="500" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Heavy parts up high make a robot rock when it stops. Heavy parts at one end change its turns.</text><rect x="160.0" y="154" width="180" height="230" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="4"/><circle cx="190.0" cy="386" r="16" fill="#1f2933"/><circle cx="310.0" cy="386" r="16" fill="#1f2933"/><rect x="216" y="178" width="68" height="44" rx="8" fill="#b7791f"/><text x="250" y="206" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">heavy</text><line x1="100" y1="400" x2="400" y2="400" stroke="#9aa5ad" stroke-width="3"/><path d="M150,150 q-30,40 0,80" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/><text x="250" y="450" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="bold">Weight up high</text><text x="250" y="476" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">It rocks and tips when it stops.</text><rect x="610.0" y="294" width="280" height="90" rx="8" fill="#ffffff" stroke="#1b6b47" stroke-width="4"/><circle cx="640.0" cy="386" r="16" fill="#1f2933"/><circle cx="860.0" cy="386" r="16" fill="#1f2933"/><rect x="716" y="318" width="68" height="44" rx="8" fill="#b7791f"/><text x="750" y="346" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">heavy</text><line x1="600" y1="400" x2="900" y2="400" stroke="#9aa5ad" stroke-width="3"/><text x="750" y="450" font-size="19" fill="#1b6b47" text-anchor="middle" font-weight="bold">Weight low and in the middle</text><text x="750" y="476" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">It stops flat. Our hub lies flat.</text><text x="500" y="520" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Try it: stop hard from full speed and watch for a wobble.</text>
</svg>
