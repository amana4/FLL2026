<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Gear play: the wobble between teeth</title>
<desc id="d">A close-up of a motor gear and an arm gear meshing, with small gaps between the teeth marked as play. Fix 1: a rubber band always pulls the arm the same way, so the gap is always on the same side; quick to try. Fix 2: a worm gear can turn a gear, but the gear can not turn the worm back, so there is no wobble; very exact but slower. Our Phase 7 arm motor stopped in the same place every run, but the arm ended a little higher or lower: that is play.</desc>
<rect width="1000" height="490" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="500" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Gear play: the wobble between teeth</text><text x="500" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Teeth never fit perfectly. The tiny gap lets the arm move a little when the motor does not.</text><rect x="60" y="100" width="420" height="300" rx="16" fill="#ffffff" stroke="#9aa5ad" stroke-width="2"/><text x="270" y="132" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">Close up: two teeth meshing</text><rect x="120" y="190" width="300" height="40" fill="#e2e8ec"/><rect x="150" y="230" width="44" height="70" rx="4" fill="#1f2933"/><rect x="250" y="230" width="44" height="70" rx="4" fill="#1f2933"/><rect x="350" y="230" width="44" height="70" rx="4" fill="#1f2933"/><text x="270" y="214" font-size="14" fill="#1f2933" text-anchor="middle" font-weight="bold">motor gear</text><rect x="120" y="340" width="300" height="40" fill="#fff4d6"/><rect x="206" y="270" width="36" height="70" rx="4" fill="#b7791f"/><rect x="306" y="270" width="36" height="70" rx="4" fill="#b7791f"/><text x="270" y="368" font-size="14" fill="#b7791f" text-anchor="middle" font-weight="bold">arm gear</text><rect x="194" y="262" width="12" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><rect x="242" y="262" width="8" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="2"/><text x="270" y="172" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">red = the gaps = play</text><rect x="520" y="100" width="420" height="140" rx="16" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="730" y="135" font-size="18" fill="#1b6b47" text-anchor="middle" font-weight="bold">Fix 1: a rubber band</text><text x="730" y="165" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">It always pulls the arm the same way,</text><text x="730" y="187" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">so the gap is always on the same side.</text><text x="730" y="215" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">Quick to try.</text><rect x="520" y="260" width="420" height="140" rx="16" fill="#e6f0fa" stroke="#2b6cb0" stroke-width="3"/><text x="730" y="295" font-size="18" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Fix 2: a worm gear</text><text x="730" y="325" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">A worm can turn a gear, but the gear</text><text x="730" y="347" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">can not turn the worm back. No wobble.</text><text x="730" y="375" font-size="15" fill="#2b6cb0" text-anchor="middle" font-weight="bold">Very exact, but slower.</text><text x="500" y="440" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">Our Phase 7 arm: the motor stopped in the same place every run, but the arm ended a little higher or lower.</text><text x="500" y="464" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="bold">That is play.</text>
</svg>
