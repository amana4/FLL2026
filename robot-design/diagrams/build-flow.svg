<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">One library, copied into every run by a tool</title>
<desc id="d">advanced.py is checked by 34 checks on the pretend hub. If they pass, build-mission.py copies the library into the top part of each run file, above a marker line. The mission code below the marker line is never touched. Then the file is loaded onto the hub.</desc>
<rect width="900" height="630" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">One library, copied into every run by a tool</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">The SPIKE app cannot load one file from another, so each run carries its own copy.</text><rect x="50.0" y="125.0" width="220" height="90" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="160" y="165.1" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">advanced.py</text><text x="160" y="186.1" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">our one library</text><polygon points="160,270.0 275.0,330 160,390.0 45.0,330" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="160" y="315.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">34 checks pass</text><text x="160" y="335.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">on the pretend</text><text x="160" y="355.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">hub?</text><polyline points="160,215 160,268" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="60.0" y="438.0" width="200" height="64" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="160" y="465.1" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="bold">Fix the library</text><text x="160" y="486.1" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="normal">first</text><polyline points="160,390 160,436" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="182" y="416" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">no</text><rect x="340.0" y="285.0" width="220" height="90" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="325.1" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">build-mission.py</text><text x="450" y="346.1" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">copies it in</text><polyline points="275,330 338,330" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="306" y="318" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">yes</text><rect x="630" y="200" width="220" height="260" rx="12" fill="#ffffff" stroke="#1f2933" stroke-width="2.5"/><text x="740" y="190" font-size="17" fill="#1f2933" text-anchor="middle" font-weight="bold">phase0-alt.py</text><rect x="642" y="212" width="196" height="120" rx="8" fill="#e8f3ee"/><text x="740" y="257.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Top part:</text><text x="740" y="277.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">the library,</text><text x="740" y="297.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">replaced every time</text><line x1="642" y1="345" x2="838" y2="345" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="8 5"/><text x="740" y="366" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="bold">the marker line</text><rect x="642" y="378" width="196" height="70" rx="8" fill="#fff4d6"/><text x="740" y="408.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Bottom part: our mission,</text><text x="740" y="428.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">never touched</text><polyline points="562,330 628,330" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="630.0" y="502.0" width="220" height="56" rx="28.0" fill="#1f2933"/><text x="740" y="535.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Load onto the hub</text><polyline points="740,462 740,500" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><text x="450" y="600" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">Copying by hand once left a wrong note about the motor sockets in M03. The tool cannot make that mistake.</text>
</svg>
