<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Our gyroscope in three steps</title>
<desc id="d">Three panels. 1, zero the yaw: at the start of every mission, the way the robot points becomes 0. 2, turn with the gyro: face(90) turns until the yaw reads 90, so mistakes do not add up. 3, drive straight: every 15 milliseconds it checks the yaw and steers back if it drifted; a wavy path without the gyro, a straight one with it. Yaw is the direction the robot points, in degrees, like a compass.</desc>
<rect width="1000" height="460" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="500" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Our gyroscope in three steps</text><text x="500" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Yaw is the direction the robot points, in degrees, like a compass.</text><rect x="20" y="95" width="300" height="340" rx="16" fill="#fff4d6" stroke="#b7791f" stroke-width="3"/><text x="170" y="132" font-size="19" fill="#b7791f" text-anchor="middle" font-weight="bold">1. Zero the yaw</text><text x="170" y="392" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">At the start of every mission,</text><text x="170" y="414" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">the way it points becomes 0.</text><rect x="350" y="95" width="300" height="340" rx="16" fill="#e6f0fa" stroke="#2b6cb0" stroke-width="3"/><text x="500" y="132" font-size="19" fill="#2b6cb0" text-anchor="middle" font-weight="bold">2. Turn with the gyro</text><text x="500" y="392" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">face(90) turns until the yaw</text><text x="500" y="414" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">reads 90. Mistakes don't add up.</text><rect x="680" y="95" width="300" height="340" rx="16" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="830" y="132" font-size="19" fill="#1b6b47" text-anchor="middle" font-weight="bold">3. Drive straight</text><text x="830" y="392" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Every 15 ms it checks the yaw</text><text x="830" y="414" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">and steers back if it drifted.</text><g transform="rotate(0 170 255)"><rect x="136" y="215" width="68" height="80" rx="6" fill="#e8f3ee" stroke="#b7791f" stroke-width="4"/><polygon points="170,197 158,215 182,215" fill="#b7791f"/></g><text x="170" y="330" font-size="18" fill="#b7791f" text-anchor="middle" font-weight="bold">yaw = 0</text><path d="M500,175 A80,80 0 0 1 580,255" fill="none" stroke="#2b6cb0" stroke-width="3" stroke-dasharray="6 4"/><g transform="rotate(90 500 255)"><rect x="466" y="215" width="68" height="80" rx="6" fill="#e8f3ee" stroke="#2b6cb0" stroke-width="4"/><polygon points="500,197 488,215 512,215" fill="#2b6cb0"/></g><text x="500" y="330" font-size="18" fill="#2b6cb0" text-anchor="middle" font-weight="bold">yaw = 90</text><path d="M790,350 q30,-40 10,-80 q-25,-40 30,-80" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="5 4"/><line x1="870" y1="350" x2="870" y2="190" stroke="#1b6b47" stroke-width="5"/><polygon points="858,192 882,192 870,172" fill="#1b6b47"/><text x="790" y="368" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="bold">no gyro</text><text x="870" y="368" font-size="13" fill="#1b6b47" text-anchor="middle" font-weight="bold">with gyro</text>
</svg>
