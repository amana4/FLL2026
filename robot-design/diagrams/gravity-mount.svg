<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Gravity mounting: pegs line the attachment up and its weight holds it</title>
<desc id="d">Two side views. 1: the attachment is lowered onto two pegs on the robot, which fit into holes so it can only go on one way. 2: it sits on the pegs, held by its own weight, with nothing clipping it. To take it off, lift it straight up. No pins to push in or forget; on or off in one move.</desc>
<rect width="900" height="490" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Gravity mounting</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Seen from the side. Pegs line it up. Its own weight holds it on. Nothing clips.</text><text x="225" y="108" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">1. Lower it onto the pegs</text><rect x="75" y="150" width="300" height="60" rx="6" fill="#fff4d6" stroke="#b7791f" stroke-width="4"/><text x="225" y="186" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="bold">attachment</text><rect x="103" y="172" width="24" height="38" fill="#ffffff" stroke="#b7791f" stroke-width="2"/><rect x="323" y="172" width="24" height="38" fill="#ffffff" stroke="#b7791f" stroke-width="2"/><polyline points="225,222 225,270" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><rect x="55" y="330" width="340" height="70" rx="6" fill="#e8f3ee" stroke="#1b6b47" stroke-width="4"/><text x="225" y="374" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">robot</text><rect x="106" y="296" width="18" height="36" rx="4" fill="#b7791f"/><rect x="326" y="296" width="18" height="36" rx="4" fill="#b7791f"/><text x="225" y="438" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">The pegs fit into holes, so it</text><text x="225" y="458" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">can only go on one way.</text><text x="675" y="108" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">2. On, and held by its weight</text><rect x="505" y="330" width="340" height="70" rx="6" fill="#e8f3ee" stroke="#1b6b47" stroke-width="4"/><text x="675" y="374" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">robot</text><rect x="556" y="296" width="18" height="36" rx="4" fill="#b7791f"/><rect x="776" y="296" width="18" height="36" rx="4" fill="#b7791f"/><rect x="525" y="272" width="300" height="60" rx="6" fill="#fff4d6" stroke="#b7791f" stroke-width="4"/><text x="675" y="308" font-size="16" fill="#b7791f" text-anchor="middle" font-weight="bold">attachment</text><rect x="553" y="294" width="24" height="38" fill="#ffffff" stroke="#b7791f" stroke-width="2"/><rect x="773" y="294" width="24" height="38" fill="#ffffff" stroke="#b7791f" stroke-width="2"/><polyline points="675,210 675,140" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="700" y="175" font-size="14" fill="#1b6b47" text-anchor="start" font-weight="bold">lift straight</text><text x="700" y="193" font-size="14" fill="#1b6b47" text-anchor="start" font-weight="bold">up to take off</text><text x="675" y="438" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">No pins to push in or forget.</text><text x="675" y="458" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">On or off in one move.</text>
</svg>
