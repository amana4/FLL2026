<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Graph: how fast drive_cm(-44) goes along the drive</title>
<desc id="d">Speed starts at 262, rises to 500 over the first 10 cm so the wheels do not slip, holds at 500, and falls back to 262 over the last 10 cm so the robot does not overshoot. It brakes about 1.2 cm before 44 cm, because the robot rolls a little after braking.</desc>
<rect width="900" height="550" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">How fast drive_cm(-44) goes, all the way along</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">This is the M03 drive into the rock. Speed is in degrees per second of wheel turn.</text><line x1="110" y1="410.0" x2="810" y2="410.0" stroke="#e3e8ec" stroke-width="1"/><text x="100" y="415.0" font-size="14" fill="#5f6b76" text-anchor="end" font-weight="normal">0</text><line x1="110" y1="360.0" x2="810" y2="360.0" stroke="#e3e8ec" stroke-width="1"/><text x="100" y="365.0" font-size="14" fill="#5f6b76" text-anchor="end" font-weight="normal">100</text><line x1="110" y1="310.0" x2="810" y2="310.0" stroke="#e3e8ec" stroke-width="1"/><text x="100" y="315.0" font-size="14" fill="#5f6b76" text-anchor="end" font-weight="normal">200</text><line x1="110" y1="260.0" x2="810" y2="260.0" stroke="#e3e8ec" stroke-width="1"/><text x="100" y="265.0" font-size="14" fill="#5f6b76" text-anchor="end" font-weight="normal">300</text><line x1="110" y1="210.0" x2="810" y2="210.0" stroke="#e3e8ec" stroke-width="1"/><text x="100" y="215.0" font-size="14" fill="#5f6b76" text-anchor="end" font-weight="normal">400</text><line x1="110" y1="160.0" x2="810" y2="160.0" stroke="#e3e8ec" stroke-width="1"/><text x="100" y="165.0" font-size="14" fill="#5f6b76" text-anchor="end" font-weight="normal">500</text><line x1="110" y1="110.0" x2="810" y2="110.0" stroke="#e3e8ec" stroke-width="1"/><text x="100" y="115.0" font-size="14" fill="#5f6b76" text-anchor="end" font-weight="normal">600</text><text x="110.0" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">0</text><text x="187.77777777777777" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">5</text><text x="265.55555555555554" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">10</text><text x="343.3333333333333" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">15</text><text x="421.1111111111111" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">20</text><text x="498.8888888888889" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">25</text><text x="576.6666666666666" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">30</text><text x="654.4444444444445" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">35</text><text x="732.2222222222222" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">40</text><text x="810.0" y="434" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">45</text><line x1="110" y1="410" x2="810" y2="410" stroke="#1f2933" stroke-width="2"/><line x1="110" y1="110" x2="110" y2="410" stroke="#1f2933" stroke-width="2"/><text x="460.0" y="462" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">distance driven (cm)</text><text x="48" y="260.0" font-size="16" fill="#1f2933" font-weight="bold" text-anchor="middle" transform="rotate(-90 48 260.0)">speed</text><polygon points="110.0,410.0 110.0,279.0 265.6,160.0 620.4,160.0 775.9,279.0 775.9,410.0" fill="#e8f3ee"/><polyline points="110.0,279.0 265.6,160.0 620.4,160.0 775.9,279.0" fill="none" stroke="#1b6b47" stroke-width="5" stroke-linejoin="round"/><line x1="775.9" y1="410.0" x2="775.9" y2="402.0" stroke="#c0392b" stroke-width="3"/><line x1="775.9" y1="283.0" x2="775.9" y2="410.0" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 4"/><line x1="794.4" y1="410.0" x2="794.4" y2="340.0" stroke="#1f2933" stroke-width="2" stroke-dasharray="5 4"/><text x="800.4444444444445" y="354.0" font-size="14" fill="#1f2933" text-anchor="start" font-weight="bold">44 cm</text><text x="187.77777777777777" y="345.0" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">speed up</text><text x="187.77777777777777" y="365.0" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">so the wheels</text><text x="187.77777777777777" y="382.0" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">do not slip</text><text x="442.962962962963" y="146.0" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">hold the speed</text><text x="698.1481481481482" y="345.0" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="bold">slow down</text><text x="698.1481481481482" y="365.0" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">so it does not</text><text x="698.1481481481482" y="382.0" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">overshoot</text><text x="450" y="520" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal">It brakes about 1.2 cm early, because the robot rolls a little after braking.</text>
</svg>
