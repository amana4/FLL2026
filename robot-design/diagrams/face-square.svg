<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Drive round a square: turning by 90 degrees against using face</title>
<desc id="d">Two paths round a square. On the left, the robot turns 90 degrees each time; each turn is a little short, the mistakes add up, and it ends 17 degrees off. On the right, the robot uses face, which measures from base; it ends about 1 degree off.</desc>
<rect width="900" height="500" rx="16" fill="#ffffff"/>
<text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Drive round a square: four turns</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">The dashed line is a perfect square. The thick line is where the robot goes.</text><polyline fill="none" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="6 6" points="110.0,290.0 260.0,290.0 260.0,140.0 110.0,140.0 110.0,290.0"/><polyline fill="none" stroke="#c0392b" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" points="110.0,290.0 260.0,290.0 271.1,140.4 122.8,118.2 89.7,264.5"/><circle cx="110" cy="290" r="9" fill="#1f2933"/><circle cx="89.7" cy="264.5" r="9" fill="#c0392b"/><text x="96" y="320" font-size="15" fill="#1f2933" text-anchor="end" font-weight="normal">start</text><text x="185.0" y="360" font-size="20" fill="#1f2933" text-anchor="middle" font-weight="bold">Turn 90 degrees each time</text><text x="185.0" y="386" font-size="18" fill="#c0392b" text-anchor="middle" font-weight="bold">ends 17 degrees off</text><polyline fill="none" stroke="#9aa5ad" stroke-width="2" stroke-dasharray="6 6" points="580.0,290.0 730.0,290.0 730.0,140.0 580.0,140.0 580.0,290.0"/><polyline fill="none" stroke="#1b6b47" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" points="580.0,290.0 730.0,290.0 732.6,140.0 582.6,142.1 580.0,292.1"/><circle cx="580" cy="290" r="9" fill="#1f2933"/><circle cx="580.0" cy="292.1" r="9" fill="#1b6b47"/><text x="566" y="320" font-size="15" fill="#1f2933" text-anchor="end" font-weight="normal">start</text><text x="655.0" y="360" font-size="20" fill="#1f2933" text-anchor="middle" font-weight="bold">face(90), face(180) ...</text><text x="655.0" y="386" font-size="18" fill="#1b6b47" text-anchor="middle" font-weight="bold">ends about 1 degree off</text><text x="450" y="450" font-size="16" fill="#c0392b" text-anchor="middle" font-weight="normal">Each small mistake gets added to the next turn.</text><text x="450" y="474" font-size="16" fill="#1b6b47" text-anchor="middle" font-weight="normal">face measures every turn from base, so mistakes do not add up.</text>
</svg>
