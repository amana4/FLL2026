<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 790" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Flowchart: how face turns to exactly the right direction</title>
<desc id="d">face works out the error: how far the target is from where the robot points now. If the error is under 1 degree, it brakes, waits 0.15 seconds and checks again. If it is still under 1 degree it is done; if it rolled past, it goes again. If the error is not under 1 degree, it works out the turning speed, fast when far off, slow when close, a little extra push when stuck just short, spins the wheels opposite ways, waits 15 milliseconds and loops.</desc>
<rect width="900" height="790" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">How face turns to exactly the right direction</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">The gyro is checked about 66 times every second.</text><rect x="180.0" y="85.0" width="240" height="50" rx="25.0" fill="#1b6b47"/><text x="300" y="115.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">face(90)</text><rect x="130.0" y="162.0" width="340" height="76" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="300" y="195.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">How far is 90 from where we</text><text x="300" y="215.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">point now? That is the error.</text><polyline points="300,135 300,161" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polygon points="300,275.0 435.0,330 300,385.0 165.0,330" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="300" y="325.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Error less than</text><text x="300" y="345.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">1 degree?</text><polyline points="300,239 300,274" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="585.0" y="295.0" width="230" height="70" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="700" y="325.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Brake. Wait</text><text x="700" y="345.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">0.15 seconds.</text><polyline points="436,330 584,330" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="510" y="318" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">yes</text><polygon points="700,410.0 825.0,470 700,530.0 575.0,470" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="700" y="465.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Still less than</text><text x="700" y="485.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">1 degree off?</text><polyline points="700,366 700,409" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="620.0" y="584.0" width="160" height="52" rx="26.0" fill="#1f2933"/><text x="700" y="615.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Done</text><polyline points="700,531 700,583" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="720" y="562" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">yes</text><polyline points="826,470 870,470 870,200 472,200" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><text x="686" y="190" font-size="15" fill="#b7791f" text-anchor="middle" font-weight="bold">no: it rolled past, so go again</text><rect x="110.0" y="442.0" width="380" height="116" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="300" y="475.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Work out the turning speed:</text><text x="300" y="495.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">far off: turn fast</text><text x="300" y="515.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">close: turn slowly</text><text x="300" y="535.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">stuck a bit short: push a bit more</text><polyline points="300,386 300,440" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="320" y="418" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">no</text><rect x="130.0" y="602.0" width="340" height="56" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="300" y="635.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Spin the wheels opposite ways</text><polyline points="300,559 300,600" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="130.0" y="705.0" width="340" height="50" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="300" y="735.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Wait 15 milliseconds</text><polyline points="300,659 300,703" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polyline points="129,730 70,730 70,200 129,200" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="50" y="470" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">loop</text>
</svg>
