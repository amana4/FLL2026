<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 360" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Flowchart: drive_cm, the simple version</title>
<desc id="d">drive_cm(-44) speeds up gently. Then it asks: more than 45 degrees off? If yes, it stops, too far off course. If no, it steers back to straight and asks: at the mark? If yes, it brakes and is done. If no, it checks again in 15 milliseconds.</desc>
<rect width="1260" height="360" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><rect x="15.0" y="168.0" width="170" height="64" rx="32.0" fill="#1b6b47"/><text x="100" y="207.35" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold">drive_cm(-44)</text><rect x="215.0" y="158.0" width="170" height="84" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="300" y="194.35" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="bold">Speed up</text><text x="300" y="220.35" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="normal">gently</text><polygon points="520,135.0 635.0,200 520,265.0 405.0,200" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="520" y="194.65" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="bold">More than</text><text x="520" y="218.65" font-size="19" fill="#1f2933" text-anchor="middle" font-weight="normal">45 degrees off?</text><rect x="395.0" y="18.0" width="250" height="64" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="520" y="44.65" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="bold">Stop. Too far</text><text x="520" y="68.65" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="normal">off course.</text><rect x="670.0" y="158.0" width="180" height="84" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="760" y="194.35" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="bold">Steer back</text><text x="760" y="220.35" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="normal">to straight</text><polygon points="975,135.0 1070.0,200 975,265.0 880.0,200" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="975" y="194.35" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="bold">At the</text><text x="975" y="220.35" font-size="21" fill="#1f2933" text-anchor="middle" font-weight="normal">mark?</text><rect x="1100.0" y="168.0" width="140" height="64" rx="32.0" fill="#1f2933"/><text x="1170" y="194.35" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="bold">Brake.</text><text x="1170" y="220.35" font-size="21" fill="#ffffff" text-anchor="middle" font-weight="normal">Done.</text><polyline points="185,200 213,200" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polyline points="385,200 403,200" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polyline points="520,135 520,84" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="548" y="118" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">yes</text><polyline points="635,200 668,200" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="652" y="188" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">no</text><polyline points="850,200 878,200" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polyline points="1070,200 1098,200" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="1084" y="188" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">yes</text><polyline points="975,265 975,320 520,320 520,267" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="748" y="345" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">no: check again in 15 ms</text>
</svg>
