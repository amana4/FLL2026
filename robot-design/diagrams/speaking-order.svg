<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Our five minutes: who speaks when</title>
<desc id="d">A timeline from 0:00 to 5:00. Strategy, missions and the robo taxi, until about 1:10. Robot, the base and attachments, until 2:15. Code, Python and drive_cm, until 3:00. Sensors, the gyroscope and yaw, until 4:00. Iteration and team, the tests, the arm fix and who did what, until 5:00. Then 5 minutes of questions, and the judges choose who answers.</desc>
<rect width="1000" height="320" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="500" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Our five minutes: who speaks when</text><text x="500" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">About a minute each. End your part by naming who comes next.</text><rect x="52.0" y="110" width="206.0" height="90" rx="10" fill="#b7791f"/><text x="155.0" y="150" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Strategy</text><text x="155.0" y="176" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal">missions, robo taxi</text><rect x="262.0" y="110" width="191.0" height="90" rx="10" fill="#2b6cb0"/><text x="357.5" y="150" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Robot</text><text x="357.5" y="176" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal">base, attachments</text><rect x="457.0" y="110" width="131.0" height="90" rx="10" fill="#1b6b47"/><text x="522.5" y="150" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Code</text><text x="522.5" y="176" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal">Python, drive_cm</text><rect x="592.0" y="110" width="176.0" height="90" rx="10" fill="#6b46c1"/><text x="680.0" y="150" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Sensors</text><text x="680.0" y="176" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal">gyroscope, yaw</text><rect x="772.0" y="110" width="176.0" height="90" rx="10" fill="#dd6b20"/><text x="860.0" y="150" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="bold">Iteration, team</text><text x="860.0" y="176" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal">tests, arm fix, team</text><line x1="50.0" y1="208" x2="50.0" y2="222" stroke="#5f6b76" stroke-width="2"/><text x="50.0" y="242" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="bold">0:00</text><line x1="230.0" y1="208" x2="230.0" y2="222" stroke="#5f6b76" stroke-width="2"/><text x="230.0" y="242" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="bold">1:00</text><line x1="410.0" y1="208" x2="410.0" y2="222" stroke="#5f6b76" stroke-width="2"/><text x="410.0" y="242" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="bold">2:00</text><line x1="590.0" y1="208" x2="590.0" y2="222" stroke="#5f6b76" stroke-width="2"/><text x="590.0" y="242" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="bold">3:00</text><line x1="770.0" y1="208" x2="770.0" y2="222" stroke="#5f6b76" stroke-width="2"/><text x="770.0" y="242" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="bold">4:00</text><line x1="950.0" y1="208" x2="950.0" y2="222" stroke="#5f6b76" stroke-width="2"/><text x="950.0" y="242" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="bold">5:00</text><text x="500" y="290" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Then 5 minutes of questions. The judges choose who answers.</text>
