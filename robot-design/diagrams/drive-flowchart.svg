<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1140" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Flowchart: how drive_cm drives straight</title>
<desc id="d">drive_cm first refuses any distance longer than the 200 cm mat. It works out the speed and ramp, aims a little short because the robot rolls after braking, and zeroes the wheel counters and gyro. Then it loops: if it has gone far enough it brakes and is done. If not, it picks the speed, reads how far off straight it is, stops with an error if that is more than 45 degrees, otherwise steers the other way, waits 15 milliseconds and loops.</desc>
<rect width="900" height="1140" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">How drive_cm drives straight</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">This loop runs about 66 times every second.</text><rect x="210.0" y="85.0" width="240" height="50" rx="25.0" fill="#1b6b47"/><text x="330" y="115.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">drive_cm(-44)</text><polygon points="330,155.0 465.0,210 330,265.0 195.0,210" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="330" y="205.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Longer than</text><text x="330" y="225.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">the mat (200 cm)?</text><polyline points="330,135 330,154" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="575.0" y="178.0" width="250" height="64" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="700" y="205.25" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">Stop: "longer than</text><text x="700" y="225.25" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal">the mat"</text><polyline points="466,210 574,210" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="520" y="198" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">yes</text><rect x="165.0" y="297.0" width="330" height="76" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="330" y="330.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Work out the speed and ramp.</text><text x="330" y="350.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Aim a little short: it rolls.</text><polyline points="330,266 330,296" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="350" y="286" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">no</text><rect x="165.0" y="407.0" width="330" height="56" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="330" y="440.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Zero the wheel counters and gyro</text><polyline points="330,374 330,406" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polygon points="330,490.0 465.0,545 330,600.0 195.0,545" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="330" y="540.1" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="bold">Gone far</text><text x="330" y="561.1" font-size="16" fill="#1f2933" text-anchor="middle" font-weight="normal">enough?</text><polyline points="330,464 330,489" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="600.0" y="517.0" width="200" height="56" rx="28.0" fill="#1f2933"/><text x="700" y="550.6" font-size="16" fill="#ffffff" text-anchor="middle" font-weight="bold">Brake. Done.</text><polyline points="466,545 598,545" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="520" y="533" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">yes</text><rect x="165.0" y="627.0" width="330" height="76" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="330" y="660.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Pick the speed:</text><text x="330" y="680.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">speed up, hold, or slow down</text><polyline points="330,601 330,626" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="350" y="618" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">no</text><rect x="165.0" y="737.0" width="330" height="56" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="330" y="770.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Read the gyro: how far off straight?</text><polyline points="330,704 330,736" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polygon points="330,820.0 465.0,875 330,930.0 195.0,875" fill="#fff4d6" stroke="#b7791f" stroke-width="2.5"/><text x="330" y="870.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">More than</text><text x="330" y="890.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">45 degrees off?</text><polyline points="330,794 330,819" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="575.0" y="843.0" width="250" height="64" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.5"/><text x="700" y="870.25" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">Brake. Stop with</text><text x="700" y="890.25" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="normal">an error.</text><polyline points="466,875 574,875" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ar)"/><text x="520" y="863" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="bold">yes</text><rect x="165.0" y="957.0" width="330" height="76" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="330" y="990.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Steer the other way,</text><text x="330" y="1010.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">harder if it is further off</text><polyline points="330,931 330,956" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="350" y="948" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">no</text><rect x="165.0" y="1065.0" width="330" height="50" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="330" y="1095.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Wait 15 milliseconds</text><polyline points="330,1034 330,1064" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><polyline points="165,1090 90,1090 90,545 192,545" fill="none" stroke="#1b6b47" stroke-width="2.5" marker-end="url(#ar)"/><text x="70" y="820" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">loop</text>
</svg>
