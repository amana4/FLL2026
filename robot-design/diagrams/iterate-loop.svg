<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">How we make the robot better: test, find a problem, change something, test again</title>
<desc id="d">A loop of four steps. 1, test it: run M03 on the mat. 2, find a problem: the bump knocks the robot crooked. 3, change something: add await face(0) right after the bump. 4, test again and write it in the log. Then repeat.</desc>
<rect width="900" height="560" rx="16" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2e8f61"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">How we make the robot better</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">This is what ITERATE means. Example from M03 Flip the Rock.</text><rect x="330" y="93" width="240" height="70" rx="14" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="450.0" y="121.0" font-size="19" fill="#1b6b47" text-anchor="middle" font-weight="bold">1. Test it</text><text x="450.0" y="145.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Run M03 on the mat.</text><rect x="553" y="258" width="240" height="84" rx="14" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="672.75" y="286.0" font-size="19" fill="#1b6b47" text-anchor="middle" font-weight="bold">2. Find a problem</text><text x="672.75" y="310.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">The bump knocks the</text><text x="672.75" y="331.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">robot crooked.</text><rect x="330" y="423" width="240" height="84" rx="14" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="450.0" y="451.0" font-size="19" fill="#1b6b47" text-anchor="middle" font-weight="bold">3. Change something</text><text x="450.0" y="475.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Add await face(0)</text><text x="450.0" y="496.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">right after the bump.</text><rect x="107" y="258" width="240" height="84" rx="14" fill="#e8f3ee" stroke="#1b6b47" stroke-width="3"/><text x="227.24999999999997" y="286.0" font-size="19" fill="#1b6b47" text-anchor="middle" font-weight="bold">4. Test again</text><text x="227.24999999999997" y="310.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Is it straight now?</text><text x="227.24999999999997" y="331.0" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">Write it in the log.</text><path d="M574,128 Q650,130 660,248" fill="none" stroke="#2e8f61" stroke-width="4" marker-end="url(#ah)"/><path d="M673,350 Q673,465 582,465" fill="none" stroke="#2e8f61" stroke-width="4" marker-end="url(#ah)"/><path d="M318,465 Q227,465 227,352" fill="none" stroke="#2e8f61" stroke-width="4" marker-end="url(#ah)"/><path d="M227,252 Q227,128 318,128" fill="none" stroke="#2e8f61" stroke-width="4" marker-end="url(#ah)"/><text x="450" y="306" font-size="20" fill="#5f6b76" text-anchor="middle" font-weight="bold">repeat</text>
</svg>
