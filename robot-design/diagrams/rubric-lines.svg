<title id="t">Robot Design: 5 rows, 10 lines</title>
<desc id="d">The Robot Design rubric. IDENTIFY: 1 mission strategy, 2 use of resources (gear). DESIGN: 3 all members had ideas (gear), 4 everyone builds and codes. CREATE: 5 attachments and why, 6 code and sensors. ITERATE: 7 repeated testing, 8 improvements from testing (gear). COMMUNICATE: 9 process and lessons (gear), 10 pride and enthusiasm (gear). Each line scores 1 to 4. A gear means it also counts for Core Values.</desc>
