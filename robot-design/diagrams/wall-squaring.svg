<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Why straight walls matter: squaring against a wall</title>
<desc id="d">Two pictures from above. 1: the robot is put down a bit crooked, and one corner touches the wall first. 2: it is pushed back flat against the wall, the whole wall touches, and it sits square. So every run starts square, and the robot can square up again during a run, with no extra code.</desc>
<rect width="900" height="520" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">Why straight walls matter</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">Seen from above. A flat wall can only sit one way against another flat wall.</text><rect x="60" y="372" width="340" height="18" fill="#8a949c"/><text x="230" y="412" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">the wall of the field</text><rect x="500" y="372" width="340" height="18" fill="#8a949c"/><text x="670" y="412" font-size="14" fill="#5f6b76" text-anchor="middle" font-weight="normal">the wall of the field</text><g transform="rotate(-14 230 255)"><rect x="130.0" y="175.0" width="200" height="160" rx="5" fill="#e8f3ee" stroke="#1b6b47" stroke-width="6"/><rect x="144.0" y="225" width="22" height="60" rx="6" fill="#1f2933"/><rect x="294.0" y="225" width="22" height="60" rx="6" fill="#1f2933"/><rect x="192" y="221" width="76" height="68" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="2.5"/></g><text x="230" y="120" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">1. Put down a bit crooked</text><text x="230" y="444" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">One corner touches first.</text><polyline points="410,255 480,255" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><text x="445" y="230" font-size="14" fill="#1b6b47" text-anchor="middle" font-weight="bold">then push</text><text x="445" y="246" font-size="14" fill="#1b6b47" text-anchor="middle" font-weight="bold">it flat</text><g transform="rotate(0 670 290)"><rect x="570.0" y="210.0" width="200" height="160" rx="5" fill="#e8f3ee" stroke="#1b6b47" stroke-width="6"/><rect x="584.0" y="260" width="22" height="60" rx="6" fill="#1f2933"/><rect x="734.0" y="260" width="22" height="60" rx="6" fill="#1f2933"/><rect x="632" y="256" width="76" height="68" rx="8" fill="#ffffff" stroke="#1f2933" stroke-width="2.5"/></g><text x="670" y="120" font-size="18" fill="#1f2933" text-anchor="middle" font-weight="bold">2. Pushed flat against it</text><text x="670" y="444" font-size="15" fill="#1b6b47" text-anchor="middle" font-weight="bold">The whole wall touches. It is square.</text><text x="450" y="490" font-size="15" fill="#5f6b76" text-anchor="middle" font-weight="normal">Every run starts square, and the robot can square up again during a run, with no extra code.</text>
</svg>
