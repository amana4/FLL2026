<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Gear ratios: what the second gear does</title>
<desc id="d">Three pictures. Same size: 12 teeth turn 12 teeth, so the arm turns at the same speed with the same push; it just changes direction. Small turns big: 12 teeth turn 36 teeth, so the arm is 3 times slower but 3 times stronger, good for lifting. Big turns small: 36 teeth turn 12 teeth, so the arm is 3 times faster but weaker, good for a quick flick. Gear ratio is teeth on the second gear divided by teeth on the first: 36 / 12 = 3.</desc>
