<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1094" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">Flowchart of one whole run: phase0-alt.py</title>
<desc id="d">Start in base. init_robot makes this direction base. Set calibration 179/180. M03 Flip the Rock: back 44 cm into the rock, face(0) to straighten after the bump, forward 22 cm. M02 Exploding Seeds: face(90), back 24 cm, face(46), arm down 380 degrees, back 22 cm, arm up 200 degrees, then arm up 180 more and drive 35 cm fast at the same time, and home.</desc>
<rect width="900" height="1094" rx="16" fill="#ffffff"/>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5f6b76"/></marker></defs><text x="450" y="40" font-size="24" fill="#1f2933" text-anchor="middle" font-weight="bold">One whole run: phase0-alt.py</text><text x="450" y="66" font-size="16" fill="#5f6b76" text-anchor="middle" font-weight="normal">M03 Flip the Rock, then M02 Exploding Seeds, then home.</text><rect x="340.0" y="87.0" width="220" height="46" rx="23.0" fill="#1b6b47"/><text x="450" y="115.25" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Start in base</text><rect x="240.0" y="159.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="187.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">init_robot: this way is now "base"</text><polyline points="450,133.0 450,157.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="240.0" y="231.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="259.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Set calibration: 179/180</text><polyline points="450,205.0 450,229.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="220" y="310" width="460" height="32" rx="6" fill="#fff4d6"/><text x="450" y="332" font-size="17" fill="#b7791f" text-anchor="middle" font-weight="bold">M03 Flip the Rock</text><line x1="450" y1="277.0" x2="450" y2="309" stroke="#5f6b76" stroke-width="2.5"/><rect x="240.0" y="349.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="377.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Back 44 cm into the rock</text><polyline points="450,342 450,347.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="240.0" y="421.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="449.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">face(0): straighten after the bump</text><polyline points="450,395.0 450,419.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="240.0" y="493.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="521.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Forward 22 cm</text><polyline points="450,467.0 450,491.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="220" y="572" width="460" height="32" rx="6" fill="#fff4d6"/><text x="450" y="594" font-size="17" fill="#b7791f" text-anchor="middle" font-weight="bold">M02 Exploding Seeds</text><line x1="450" y1="539.0" x2="450" y2="571" stroke="#5f6b76" stroke-width="2.5"/><rect x="240.0" y="611.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="639.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">face(90), back 24 cm, face(46)</text><polyline points="450,604 450,609.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="240.0" y="683.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="711.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Arm down: 380 degrees</text><polyline points="450,657.0 450,681.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="240.0" y="755.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="783.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Back 22 cm</text><polyline points="450,729.0 450,753.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="240.0" y="827.0" width="420" height="46" rx="10" fill="#e8f3ee" stroke="#1b6b47" stroke-width="2.5"/><text x="450" y="855.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Arm up 200 degrees</text><polyline points="450,801.0 450,825.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="240" y="890.0" width="420" height="64" rx="10" fill="#e6f0fa" stroke="#2b6cb0" stroke-width="2.5"/><text x="450" y="917.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="bold">Arm up 180 more AND drive 35 cm fast</text><text x="450" y="937.25" font-size="15" fill="#1f2933" text-anchor="middle" font-weight="normal">at the same time</text><polyline points="450,873.0 450,888.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/><rect x="340.0" y="989.0" width="220" height="46" rx="23.0" fill="#1f2933"/><text x="450" y="1017.25" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="bold">Home</text><polyline points="450,954.0 450,987.0" fill="none" stroke="#5f6b76" stroke-width="2.5" marker-end="url(#ar)"/>
</svg>
